<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日健康打卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981',
                        secondary: '#059669',
                        accent: '#34d399',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.1), 0 8px 10px -6px rgba(16, 185, 129, 0.1);
        }
        .health-card {
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .health-card.active-healthy {
            border-color: #10b981;
            background-color: rgba(16, 185, 129, 0.05);
        }
        .health-card.active-mild {
            border-color: #f59e0b;
            background-color: rgba(245, 158, 11, 0.05);
        }
        .health-card.active-severe {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.05);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航 -->
    <header class="gradient-bg text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa fa-heartbeat text-2xl"></i>
                <h1 class="text-xl font-bold">每日健康打卡</h1>
            </div>
            <div class="text-sm opacity-90" id="currentDate"></div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-4xl">
        <!-- 打卡状态卡片 -->
        <div class="mb-6">
            <div id="statusCard" class="bg-white rounded-2xl p-6 card-shadow border-l-4 border-warning">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-lg font-semibold text-gray-800">今日打卡状态</h2>
                        <p id="statusText" class="text-gray-500 mt-1">您今日尚未完成健康打卡</p>
                    </div>
                    <div id="statusIcon" class="w-14 h-14 rounded-full bg-warning/10 flex items-center justify-center">
                        <i class="fa fa-exclamation-circle text-2xl text-warning"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 打卡表单 -->
        <div id="checkinForm" class="bg-white rounded-2xl p-6 card-shadow mb-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-5 flex items-center">
                <i class="fa fa-pencil-square-o text-primary mr-2"></i>
                健康信息填报
            </h2>
            
            <div class="space-y-5">
                <!-- 体温 -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">
                        <i class="fa fa-thermometer-half text-primary mr-1"></i>
                        今日体温 (℃)
                    </label>
                    <input type="number" id="temperature" step="0.1" min="35" max="42" placeholder="请输入体温，如 36.5"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none transition-all">
                    <p class="text-xs text-gray-400 mt-1">正常范围：36.0℃ - 37.2℃</p>
                </div>

                <!-- 健康状况 -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">
                        <i class="fa fa-user-md text-primary mr-1"></i>
                        健康状况
                    </label>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="health-card" data-value="healthy" onclick="selectHealth('healthy')">
                            <i class="fa fa-smile-o text-2xl text-primary mb-2 block"></i>
                            <span class="text-sm">健康良好</span>
                        </div>
                        <div class="health-card" data-value="mild" onclick="selectHealth('mild')">
                            <i class="fa fa-meh-o text-2xl text-warning mb-2 block"></i>
                            <span class="text-sm">轻微不适</span>
                        </div>
                        <div class="health-card" data-value="severe" onclick="selectHealth('severe')">
                            <i class="fa fa-frown-o text-2xl text-danger mb-2 block"></i>
                            <span class="text-sm">身体不适</span>
                        </div>
                    </div>
                    <input type="hidden" id="healthStatus" value="">
                </div>

                <!-- 症状多选 -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">
                        <i class="fa fa-stethoscope text-primary mr-1"></i>
                        有无以下症状（可多选）
                    </label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                        <label class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="checkbox" name="symptom" value="发热" class="w-4 h-4 text-primary rounded">
                            <span class="text-sm text-gray-600">发热</span>
                        </label>
                        <label class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="checkbox" name="symptom" value="咳嗽" class="w-4 h-4 text-primary rounded">
                            <span class="text-sm text-gray-600">咳嗽</span>
                        </label>
                        <label class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="checkbox" name="symptom" value="乏力" class="w-4 h-4 text-primary rounded">
                            <span class="text-sm text-gray-600">乏力</span>
                        </label>
                        <label class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="checkbox" name="symptom" value="头痛" class="w-4 h-4 text-primary rounded">
                            <span class="text-sm text-gray-600">头痛</span>
                        </label>
                        <label class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="checkbox" name="symptom" value="腹泻" class="w-4 h-4 text-primary rounded">
                            <span class="text-sm text-gray-600">腹泻</span>
                        </label>
                        <label class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="checkbox" name="symptom" value="咽痛" class="w-4 h-4 text-primary rounded">
                            <span class="text-sm text-gray-600">咽痛</span>
                        </label>
                        <label class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="checkbox" name="symptom" value="鼻塞" class="w-4 h-4 text-primary rounded">
                            <span class="text-sm text-gray-600">鼻塞</span>
                        </label>
                        <label class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="checkbox" name="symptom" value="无异常" class="w-4 h-4 text-primary rounded">
                            <span class="text-sm text-gray-600">无异常</span>
                        </label>
                    </div>
                </div>

                <!-- 备注 -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">
                        <i class="fa fa-comment-o text-primary mr-1"></i>
                        其他备注
                    </label>
                    <textarea id="remark" rows="2" placeholder="如有其他情况可在此说明（选填）"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none transition-all resize-none"></textarea>
                </div>

                <!-- 错误提示 -->
                <div id="errorMsg" class="hidden text-danger text-sm text-center bg-red-50 py-2 rounded-lg"></div>

                <!-- 提交按钮 -->
                <button id="submitBtn" onclick="submitCheckin()"
                    class="w-full gradient-bg text-white font-medium py-3.5 rounded-xl hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center justify-center space-x-2">
                    <i class="fa fa-check-circle"></i>
                    <span>提交打卡</span>
                </button>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl p-4 card-shadow">
                <div class="text-gray-500 text-sm mb-1">连续打卡</div>
                <div class="text-2xl font-bold text-primary" id="streakDays">0</div>
                <div class="text-xs text-gray-400">天</div>
            </div>
            <div class="bg-white rounded-xl p-4 card-shadow">
                <div class="text-gray-500 text-sm mb-1">累计打卡</div>
                <div class="text-2xl font-bold text-primary" id="totalDays">0</div>
                <div class="text-xs text-gray-400">天</div>
            </div>
            <div class="bg-white rounded-xl p-4 card-shadow">
                <div class="text-gray-500 text-sm mb-1">健康天数</div>
                <div class="text-2xl font-bold text-green-500" id="healthyDays">0</div>
                <div class="text-xs text-gray-400">天</div>
            </div>
            <div class="bg-white rounded-xl p-4 card-shadow">
                <div class="text-gray-500 text-sm mb-1">平均体温</div>
                <div class="text-2xl font-bold text-blue-500" id="avgTemp">--</div>
                <div class="text-xs text-gray-400">℃</div>
            </div>
        </div>

        <!-- 历史记录 -->
        <div class="bg-white rounded-2xl p-6 card-shadow">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-semibold text-gray-800 flex items-center">
                    <i class="fa fa-history text-primary mr-2"></i>
                    打卡历史
                </h2>
                <button id="clearHistory" onclick="clearAll()" class="text-sm text-gray-400 hover:text-danger transition-colors">
                    <i class="fa fa-trash-o mr-1"></i>清空记录
                </button>
            </div>
            
            <div id="historyList" class="space-y-3">
                <div class="text-center py-8 text-gray-400">
                    <i class="fa fa-file-text-o text-3xl mb-2 block opacity-50"></i>
                    <p>暂无打卡记录</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部 -->
    <footer class="text-center py-6 text-gray-400 text-sm">
        <p>健康打卡 · 每日守护 <i class="fa fa-heart text-danger/60"></i></p>
    </footer>

    <!-- 成功提示弹窗 -->
    <div id="successToast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-primary text-white px-6 py-3 rounded-xl shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50">
        <div class="flex items-center space-x-2">
            <i class="fa fa-check-circle"></i>
            <span>打卡成功！</span>
        </div>
    </div>

    <script>
        // 日期显示
        function updateDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', options);
        }
        updateDate();

        // 获取今日日期字符串
        function getTodayStr() {
            const now = new Date();
            return now.toISOString().split('T')[0];
        }

        // 本地存储键名
        const STORAGE_KEY = 'health_checkin_records';

        // 获取所有记录
        function getRecords() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // 保存记录
        function saveRecords(records) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }

        // 选择健康状况
        let selectedHealth = '';
        function selectHealth(value) {
            selectedHealth = value;
            document.getElementById('healthStatus').value = value;
            
            // 移除所有激活状态
            document.querySelectorAll('.health-card').forEach(card => {
                card.classList.remove('active-healthy', 'active-mild', 'active-severe');
            });
            
            // 添加当前激活状态
            const activeCard = document.querySelector(`.health-card[data-value="${value}"]`);
            if (activeCard) {
                activeCard.classList.add(`active-${value}`);
            }
            
            // 隐藏错误提示
            hideError();
        }

        // 显示错误
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        // 隐藏错误
        function hideError() {
            document.getElementById('errorMsg').classList.add('hidden');
        }

        // 提交打卡
        function submitCheckin() {
            const temperature = document.getElementById('temperature').value.trim();
            const symptoms = Array.from(document.querySelectorAll('input[name="symptom"]:checked')).map(cb => cb.value);
            const remark = document.getElementById('remark').value.trim();
            
            // 验证
            if (!temperature) {
                showError('请输入体温');
                return;
            }
            if (temperature < 35 || temperature > 42) {
                showError('请输入正常范围的体温值（35-42℃）');
                return;
            }
            if (!selectedHealth) {
                showError('请选择健康状况');
                return;
            }
            
            hideError();
            
            // 保存记录
            const records = getRecords();
            const today = getTodayStr();
            
            // 移除今日已有记录（更新）
            const filteredRecords = records.filter(r => r.date !== today);
            
            const newRecord = {
                date: today,
                temperature: temperature,
                status: selectedHealth,
                symptoms: symptoms,
                remark: remark,
                timestamp: Date.now()
            };
            
            filteredRecords.push(newRecord);
            saveRecords(filteredRecords);
            
            // 更新界面
            showToast();
            checkTodayStatus();
            calculateStats();
            renderHistory();
        }

        // 检查今日是否已打卡
        function checkTodayStatus() {
            const records = getRecords();
            const today = getTodayStr();
            const todayRecord = records.find(r => r.date === today);
            
            const statusCard = document.getElementById('statusCard');
            const statusText = document.getElementById('statusText');
            const statusIcon = document.getElementById('statusIcon');
            const submitBtn = document.getElementById('submitBtn');
            
            if (todayRecord) {
                // 已打卡
                statusCard.classList.remove('border-warning');
                statusCard.classList.add('border-primary');
                
                statusText.textContent = `您今日已完成打卡 · ${todayRecord.temperature}℃`;
                
                statusIcon.className = 'w-14 h-14 rounded-full bg-primary/10 flex items-center justify-center';
                statusIcon.innerHTML = '<i class="fa fa-check-circle text-2xl text-primary"></i>';
                
                // 禁用表单
                document.getElementById('temperature').disabled = true;
                document.querySelectorAll('input[name="symptom"]').forEach(el => el.disabled = true);
                document.getElementById('remark').disabled = true;
                document.querySelectorAll('.health-card').forEach(card => card.style.pointerEvents = 'none');
                
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-60', 'cursor-not-allowed');
                submitBtn.innerHTML = '<i class="fa fa-check"></i><span>今日已打卡</span>';
                
                // 填充已有数据
                document.getElementById('temperature').value = todayRecord.temperature;
                selectHealth(todayRecord.status);
                document.getElementById('remark').value = todayRecord.remark || '';
                
                todayRecord.symptoms.forEach(sym => {
                    const checkbox = document.querySelector(`input[name="symptom"][value="${sym}"]`);
                    if (checkbox) checkbox.checked = true;
                });
            }
        }

        // 计算统计数据
        function calculateStats() {
            const records = getRecords();
            
            document.getElementById('totalDays').textContent = records.length;
            
            const healthyCount = records.filter(r => r.status === 'healthy').length;
            document.getElementById('healthyDays').textContent = healthyCount;
            
            if (records.length > 0) {
                const totalTemp = records.reduce((sum, r) => sum + parseFloat(r.temperature), 0);
                const avg = (totalTemp / records.length).toFixed(1);
                document.getElementById('avgTemp').textContent = avg;
            }
            
            // 连续打卡天数
            let streak = 0;
            const today = new Date();
            for (let i = 0; i < 365; i++) {
                const checkDate = new Date(today);
                checkDate.setDate(today.getDate() - i);
                const dateStr = checkDate.toISOString().split('T')[0];
                
                if (records.find(r => r.date === dateStr)) {
                    streak++;
                } else if (i > 0) {
                    break;
                }
            }
            document.getElementById('streakDays').textContent = streak;
        }

        // 渲染历史记录
        function renderHistory() {
            const records = getRecords().sort((a, b) => new Date(b.date) - new Date(a.date));
            const historyList = document.getElementById('historyList');
            
            if (records.length === 0) {
                historyList.innerHTML = `
                    <div class="text-center py-8 text-gray-400">
                        <i class="fa fa-file-text-o text-3xl mb-2 block opacity-50"></i>
                        <p>暂无打卡记录</p>
                    </div>
                `;
                return;
            }
            
            historyList.innerHTML = records.slice(0, 10).map(record => {
                const statusMap = {
                    healthy: { text: '健康良好', color: 'text-green-500', icon: 'smile-o' },
                    mild: { text: '轻微不适', color: 'text-warning', icon: 'meh-o' },
                    severe: { text: '身体不适', color: 'text-danger', icon: 'frown-o' }
                };
                const status = statusMap[record.status] || statusMap.healthy;
                
                const dateObj = new Date(record.date);
                const dateStr = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日`;
                const weekStr = ['周日','周一','周二','周三','周四','周五','周六'][dateObj.getDay()];
                
                return `
                    <div class="flex items-center p-4 rounded-xl border border-gray-100 hover:border-primary/30 hover:bg-gray-50/50 transition-all">
                        <div class="w-14 text-center">
                            <div class="font-semibold text-gray-800">${dateStr}</div>
                            <div class="text-xs text-gray-400">${weekStr}</div>
                        </div>
                        <div class="flex-1 ml-4">
                            <div class="flex items-center space-x-2">
                                <span class="text-sm font-medium ${status.color}">
                                    <i class="fa fa-${status.icon} mr-1"></i>${status.text}
                                </span>
                                <span class="text-sm text-gray-500">· ${record.temperature}℃</span>
                            </div>
                            <div class="text-xs text-gray-400 mt-1">
                                ${record.symptoms.length > 0 ? '症状：' + record.symptoms.join('、') : '无不适症状'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 显示成功提示
        function showToast() {
            const toast = document.getElementById('successToast');
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        // 清空记录
        function clearAll() {
            if (confirm('确定要清空所有打卡记录吗？此操作不可恢复。')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        // 初始化
        window.onload = function() {
            checkTodayStatus();
            calculateStats();
            renderHistory();
        };
    </script>
</body>
</html>
